services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kya
      POSTGRES_PASSWORD: kya
      POSTGRES_DB: kya_khaoon
    ports:
      - "5432:5432"
    volumes:
      - kya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kya -d kya_khaoon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kya_pgdata:
