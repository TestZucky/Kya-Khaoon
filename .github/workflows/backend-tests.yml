name: Backend tests

# Runs on PRs into main (before merge) and on main itself (after merge, so a
# broken merge result is caught even though every PR was green on its own).
#
# Deliberately no `paths:` filter. This job is a required status check, and a
# path-filtered required check never reports on PRs that don't touch those
# paths — GitHub leaves it pending and the PR can never merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete. Never cancel on main —
# every commit there should have its own recorded result.
concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name is the required status check on main — renaming it silently
  # un-protects the branch until the rule is updated to match.
  test:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # `make test` is `docker compose run --rm tests`: the same image, the same
      # Postgres and the same runner you get locally. Nothing is installed on
      # the runner itself, so CI cannot drift from a developer's machine.
      - name: Run backend suite
        run: make test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
